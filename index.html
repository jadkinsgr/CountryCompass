<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Country Compass — Find Where to Live</title>
  <meta name="description" content="Filter every US county by cost of living, climate, demographics, economy, health, laws and natural hazards." />
  <meta name="theme-color" content="#070c11" />
  <!-- Data Lab mark (same as midatalab.net) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%23070c11'/%3E%3Cg stroke='%231ed760' stroke-width='7' stroke-linecap='round' fill='none'%3E%3Cline x1='68' y1='46.1' x2='81.5' y2='22.8'/%3E%3Cline x1='49.9' y1='47.6' x2='39' y2='34.2'/%3E%3Cline x1='75.9' y1='61.3' x2='100' y2='63.3'/%3E%3Cline x1='47.3' y1='69.7' x2='32.4' y2='81.1'/%3E%3Cline x1='61.4' y1='75.9' x2='63.3' y2='98'/%3E%3C/g%3E%3Ccircle cx='60' cy='60' r='16' stroke='%231ed760' stroke-width='7' fill='none'/%3E%3Ccircle cx='86' cy='15' r='9' stroke='%231ed760' stroke-width='7' fill='none'/%3E%3Ccircle cx='34' cy='28' r='8' stroke='%231ed760' stroke-width='7' fill='none'/%3E%3Ccircle cx='108' cy='64' r='8' stroke='%231ed760' stroke-width='7' fill='none'/%3E%3Ccircle cx='26' cy='86' r='8' stroke='%231ed760' stroke-width='7' fill='none'/%3E%3Ccircle cx='64' cy='106' r='8' stroke='%231ed760' stroke-width='7' fill='none'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="open-filters" aria-label="Open filters" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4" /></svg>
    </button>
    <div class="brand">
      <a class="brand-logo" href="https://midatalab.net/" target="_blank" rel="noopener" aria-label="Data Lab (opens midatalab.net)">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs><linearGradient id="dlMark" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6EE7A0" /><stop offset="1" stop-color="#C4F135" /></linearGradient></defs>
          <g stroke="url(#dlMark)" stroke-width="6" stroke-linecap="round">
            <line x1="68" y1="46.1" x2="81.5" y2="22.8" />
            <line x1="49.9" y1="47.6" x2="39" y2="34.2" />
            <line x1="75.9" y1="61.3" x2="100" y2="63.3" />
            <line x1="47.3" y1="69.7" x2="32.4" y2="81.1" />
            <line x1="61.4" y1="75.9" x2="63.3" y2="98" />
          </g>
          <g stroke="url(#dlMark)" stroke-width="6" fill="none">
            <circle cx="60" cy="60" r="16" />
            <circle cx="86" cy="15" r="9" />
            <circle cx="34" cy="28" r="8" />
            <circle cx="108" cy="64" r="8" />
            <circle cx="26" cy="86" r="8" />
            <circle cx="64" cy="106" r="8" />
          </g>
        </svg>
      </a>
      <div class="brand-text">
        <a class="brand-name" href="./">Country Compass</a>
        <a class="brand-by" href="https://midatalab.net/" target="_blank" rel="noopener">by Data Lab</a>
      </div>
    </div>
    <div class="topbar-actions">
      <label class="toggle" title="Show only your favorite counties">
        <input type="checkbox" id="fav-only" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">♥ <span class="hide-mobile">Favorites only</span> <span id="fav-count" class="pill">0</span></span>
      </label>
      <button class="btn ghost" id="share-btn" title="Copy a link to this exact view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" /></svg>
        <span class="hide-mobile">Share</span>
      </button>
      <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Filters">
      <div class="match-card">
        <div>
          <div class="match-count"><span id="match-count">—</span></div>
          <div class="match-label">of <span id="total-count">—</span> counties match</div>
        </div>
        <button class="btn ghost small" id="reset-btn" disabled>Reset</button>
      </div>
      <div class="sidebar-scroll" id="filters"></div>
      <div class="sidebar-footer only-mobile">
        <button class="btn primary block" id="close-filters">Show <span id="match-count-mobile">—</span> counties</button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="map-area">
      <div class="map-toolbar">
        <label class="select-wrap">
          <span>Color by</span>
          <select id="color-by"><option value="">Match only</option></select>
        </label>
        <button class="btn" id="results-btn" aria-expanded="false" aria-controls="results">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
          Results
        </button>
        <button class="btn" id="csv-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3" /></svg>
          <span class="hide-mobile">Download</span> CSV
        </button>
      </div>

      <div class="map-wrap" id="map-wrap">
        <svg id="map" role="img" aria-label="Map of US counties"></svg>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>Loading county data…</p>
        </div>
      </div>

      <div class="legend" id="legend" hidden></div>

      <div class="zoom-controls">
        <button class="icon-btn" id="zoom-in" aria-label="Zoom in">+</button>
        <button class="icon-btn" id="zoom-out" aria-label="Zoom out">−</button>
        <button class="icon-btn" id="zoom-reset" aria-label="Reset zoom">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6" /></svg>
        </button>
      </div>

      <aside class="results" id="results" hidden>
        <div class="panel-head">
          <h2>Matching counties</h2>
          <button class="icon-btn" id="results-close" aria-label="Close results">✕</button>
        </div>
        <input type="search" id="results-search" placeholder="Search counties…" />
        <ol class="results-list" id="results-list"></ol>
        <p class="results-more" id="results-more"></p>
      </aside>

      <aside class="detail" id="detail" hidden aria-live="polite"></aside>
    </main>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
